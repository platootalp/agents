[project]
name = "engineer"
version = "0.1.0"
description = "AI engineer tools and utilities"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "tavily-python>=0.7.17",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.7",
    "pydantic>=2.0.0",
    "fastmcp>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = false
