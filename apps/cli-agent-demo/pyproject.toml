[project]
name = "cli-agent-demo"
version = "0.1.0"
description = "Interactive CLI Agent with Rich UI, OpenAI, Tool Calling, and Persistent Memory"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.50.0",
]

[project.scripts]
cli-agent = "cli_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent"]

[tool.uv]
package = true
