[project]
name = "agents"
version = "0.1.0"
description = "AI Agents Monorepo - A collection of agent-based applications and tools"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[tool.uv.workspace]
members = [
    "apps/*",
    "apps/langgraph-templates/*",
    "packages/*",
]
exclude = ["apps/langgraph-templates"]

[tool.uv.sources]
rag-utils = { workspace = true }
ai-utils = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

# Shared dependency groups for common use cases
langchain = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
]

langchain-providers = [
    "langchain-anthropic>=0.3.0",
    "langchain-fireworks>=0.2.0",
    "langchain-community>=0.3.0",
]

ml = [
    "numpy>=1.24.0,<2.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tqdm>=4.65.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
ignore_missing_imports = true
follow_untyped_imports = false
exclude = [
    "tests/",
    "test/",
    ".venv/",
]
